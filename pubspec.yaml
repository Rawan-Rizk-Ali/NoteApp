name: noteapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: ^0.20.2

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  just_audio: ^0.9.40

  # Image Picker
  image_picker: ^1.1.2

  # Audio Recording
  record: ^6.0.0

  # File Path Handling
  path_provider: ^2.1.5
  google_fonts: ^6.3.0
  provider: ^6.1.5
  flutter_secure_storage: ^9.2.2
  share_plus: ^10.0.2

  # HTTP package for uploading to imgBB
  http: ^1.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/images/splachScreen.png
    - assets/images/background.jpeg
